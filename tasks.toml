# Repository-wide task entry point.

[workspace]
members = ["apps/*", "packages/*", "website"]

[tasks."website:dev"]
run = "esdev start"
dir = "website"

[tasks.test]
# Run the existing library suite with the project's ES development runtime.
run = "esdev test packages/obj-diff --setup=./setup.ts"

[tasks."library:build"]
run = "esdev build --target=library"
dir = "packages/obj-diff"

[tasks."library:type-check"]
run = "tsc --noEmit"
dir = "packages/obj-diff"

[tasks.lint]
run = "biome lint src/"
dir = "packages/obj-diff"

[tasks.fmt]
run = "biome format --write src/"
dir = "packages/obj-diff"

[tasks."fmt:check"]
run = "biome check src/"
dir = "packages/obj-diff"

[tasks."library:test:dist"]
run = "esdev test packages/obj-diff --setup=./setup.ts"
env = { TEST_DIST = "true" }
deps = ["library:build"]

[tasks.demo]
run = "esdev start"
dir = "apps/demo"

[tasks."website:build"]
run = "esdev build --minify"
dir = "website"

[tasks."benchmarks:collect"]
run = "bun benchmarks/collect.mjs"
deps = ["library:build"]

[tasks.ci]
deps = ["library:build", "test", "library:type-check", "lint", "fmt:check", "website:build"]
