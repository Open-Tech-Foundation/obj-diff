name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and GitHub Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_opentf_obj_diff: ${{ steps.check.outputs.release_opentf_obj_diff }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - id: check
        run: |
          echo "should_release=$(otf-release check --exclude-package @opentf/obj-diff)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_obj_diff=$(otf-release check --package @opentf/obj-diff)" >> "$GITHUB_OUTPUT"

  publish-opentf-obj-diff:
    needs: [check-release]
    if: needs.check-release.outputs.release_opentf_obj_diff == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build @opentf/obj-diff
        run: npm run build
        working-directory: packages/obj-diff
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --package @opentf/obj-diff
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: [check-release, publish-opentf-obj-diff]
    if: >-
      always() &&
      needs.check-release.outputs.should_release == 'true' &&
      needs.publish-opentf-obj-diff.result != 'failure' &&
      needs.publish-opentf-obj-diff.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --exclude-package @opentf/obj-diff
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
